name: Audit des dépendances

# Sur chaque PR/push vers main (attrape une dépendance vulnérable ajoutée
# volontairement) ET une fois par semaine (attrape une CVE publiée après
# coup sur une dépendance déjà en place, sans qu'aucun code n'ait changé).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit sur ${{ matrix.service }}/requirements.txt
        run: |
          pip install --quiet pip-audit
          # --- Ignores documentés (à revoir régulièrement) ---
          # PYSEC-2026-1325 : side-channel temporel dans ecdsa (transitif via
          #   python-jose). Les mainteneurs ne corrigeront pas (documenté),
          #   aucune version de correction n'existe.
          # starlette (0.38.x, transitif via fastapi==0.115.0) : série de CVE
          #   de type DoS dont le correctif exige starlette >= 1.3.x, donc une
          #   montée majeure de fastapi. Traité à part (voir PR Dependabot
          #   "backend: bump the patch-et-mineur group") qui demande un test
          #   complet du site. À RETIRER dès que fastapi/starlette sont montés.
          pip-audit -r "${{ matrix.service }}/requirements.txt" \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installation (lockfile figé)
        working-directory: frontend
        run: npm ci

      # --omit=dev : la prod est un build statique servi par Caddy — seules
      # les dépendances runtime finissent dans le bundle livré aux visiteurs.
      # Les failles des outils de dev (vite/esbuild : serveur de dev) restent
      # visibles via les alertes Dependabot + l'audit hebdo complet ci-dessous,
      # mais ne bloquent pas les PR.
      - name: npm audit (deps runtime) — bloque à partir de "high"
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit complet (dev inclus) — informatif, non bloquant
        working-directory: frontend
        run: npm audit || true

  trivy-fs:
    name: Trivy (dépendances + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mode "fs" : scanne requirements.txt / package-lock.json directement
      # dans le dépôt, sans construire les images. Complète pip-audit/npm
      # audit avec sa propre base de vulnérabilités, + détection de secrets
      # commités.  BLOQUANT.
      - name: Trivy — dépendances + secrets (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # Durcissement Dockerfile/IaC (conteneur en root, apt sans
      # --no-install-recommends...). Informatif tant que les Dockerfiles
      # ne sont pas passés en USER non-root (demande de tester les volumes
      # uploads/logs). exit-code 0 = ne bloque pas.
      - name: Trivy — misconfig (informatif)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig"
          severity: "HIGH,CRITICAL"
          exit-code: "0"